<!DOCTYPE html>
<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenChiken | Skills</title>
<link rel="icon" type="image/png" href="/static/assets/logo.png"/>
<link href="/static/shared.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

</head>
<body class="bg-background text-on-surface font-body">
<main>
<header class="mb-8">
<div class="flex items-center justify-between gap-4 flex-wrap">
  <div>
    <h1 class="text-3xl font-headline font-bold tracking-tight text-on-surface">Skills</h1>
    <p class="text-on-surface-variant font-body text-sm">설치된 스킬 목록과 연결 상태를 확인합니다.</p>
  </div>
  <button id="btn-reload-skills"
    class="flex items-center gap-2 px-4 py-2 rounded-xl bg-surface-container-highest font-label font-bold text-xs uppercase tracking-widest text-on-surface hover:bg-primary/10 hover:text-primary transition-all">
    <span class="material-symbols-outlined text-base">refresh</span>
    스킬 재로드
  </button>
</div>
</header>

<!-- Skills Grid -->
<div id="skills-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-12">
<div class="skeleton-block h-48"></div>
<div class="skeleton-block h-48"></div>
<div class="skeleton-block h-48"></div>
<div class="skeleton-block h-48"></div>
<div class="skeleton-block h-48"></div>
<div class="skeleton-block h-48"></div>
</div>

<!-- Summary -->
<div id="skills-summary" class="hidden">
<div class="flex items-center gap-4 mb-6">
<h2 class="font-headline text-xl font-bold text-on-surface">요약</h2>
<div class="h-[1px] flex-grow bg-outline-variant/20"></div>
</div>
<div class="grid grid-cols-2 sm:grid-cols-6 gap-4">
<div class="bg-surface-container-low rounded-xl p-5 text-center">
<p id="cnt-total" class="font-headline text-3xl font-bold text-primary">0</p>
<p class="font-label text-[10px] uppercase tracking-wider text-on-surface-variant mt-1">전체</p>
</div>
<div class="bg-surface-container-low rounded-xl p-5 text-center">
<p id="cnt-connected" class="font-headline text-3xl font-bold text-primary">0</p>
<p class="font-label text-[10px] uppercase tracking-wider text-on-surface-variant mt-1">연결됨</p>
</div>
<div class="bg-surface-container-low rounded-xl p-5 text-center ring-1 ring-secondary/20">
<p id="cnt-hub" class="font-headline text-3xl font-bold text-secondary">0</p>
<p class="font-label text-[10px] uppercase tracking-wider text-on-surface-variant mt-1">허브 설치</p>
</div>
<div class="bg-surface-container-low rounded-xl p-5 text-center ring-1 ring-tertiary/20">
<p id="cnt-ai" class="font-headline text-3xl font-bold text-tertiary">0</p>
<p class="font-label text-[10px] uppercase tracking-wider text-on-surface-variant mt-1">AI 자동생성</p>
</div>
<div class="bg-surface-container-low rounded-xl p-5 text-center">
<p id="cnt-auth" class="font-headline text-3xl font-bold text-error">0</p>
<p class="font-label text-[10px] uppercase tracking-wider text-on-surface-variant mt-1">인증 필요</p>
</div>
<div class="bg-surface-container-low rounded-xl p-5 text-center">
<p id="cnt-disabled" class="font-headline text-3xl font-bold text-outline">0</p>
<p class="font-label text-[10px] uppercase tracking-wider text-on-surface-variant mt-1">비활성</p>
</div>
</div>
</div>
</main>

<!-- API 키 등록 모달 -->
<div id="env-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm p-4">
  <div id="modal-panel" class="bg-surface-container rounded-2xl shadow-2xl w-full max-w-md transition-all duration-200 scale-95 opacity-0">
    <div class="flex items-center justify-between px-6 pt-6 pb-4 border-b border-outline-variant/15">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-yellow-400 text-xl">key</span>
        <div>
          <h2 class="font-headline font-bold text-on-surface text-base">API 키 등록</h2>
          <p class="font-label text-[10px] text-on-surface-variant uppercase tracking-wider mt-0.5" id="modal-skill-name"></p>
        </div>
      </div>
      <button id="btn-close-modal" class="text-outline hover:text-on-surface transition-colors rounded-lg p-1">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>
    <div class="px-6 py-5">
      <p class="font-body text-sm text-on-surface-variant mb-5">
        이 스킬을 사용하려면 아래 API 키가 필요합니다.<br>
        입력한 키는 <code class="bg-surface-container-highest px-1 rounded text-xs font-mono text-secondary">~/.openchiken/.env</code>에 안전하게 저장됩니다.
      </p>
      <div id="modal-env-fields"></div>
      <div id="modal-docs-link" class="hidden mb-4 p-3 rounded-lg bg-surface-container-highest/60 border border-outline-variant/20"></div>
      <div id="modal-save-status"></div>
    </div>
    <div class="flex items-center justify-end gap-3 px-6 pb-6">
      <button id="btn-cancel-modal"
        class="px-4 py-2 rounded-xl font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest transition-colors">
        취소
      </button>
      <button id="btn-save-env"
        class="flex items-center gap-2 px-5 py-2 rounded-xl bg-yellow-500/20 text-yellow-400 font-label text-xs font-bold uppercase tracking-widest hover:bg-yellow-500/30 transition-colors">
        <span class="material-symbols-outlined text-sm">save</span> 저장
      </button>
    </div>
  </div>
</div>

<script src="/static/shared.js"></script>

      <rect width="48" height="48" rx="10" fill="#5C6BC0"/>
      <rect x="6" y="28" width="10" height="14" rx="2" fill="white" opacity="0.9"/>
      <rect x="19" y="20" width="10" height="22" rx="2" fill="white" opacity="0.9"/>
      <rect x="32" y="14" width="10" height="28" rx="2" fill="white" opacity="0.9"/>
      <path d="M8 14 Q18 8 24 14 Q30 20 40 12" stroke="#FFD740" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>`,

    wallstreetbets: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#FF4500"/>

      <path d="M16 30 Q24 24 32 30 L32 40 Q24 36 16 40z" fill="white" opacity="0.7"/>
    </svg>`,

    air_quality: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#00ACC1"/>
      <path d="M8 20 Q16 14 24 20 Q32 26 40 20" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>

      <path d="M12 36 Q20 30 28 36" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
    </svg>`,

    earthquake: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#BF360C"/>
      <polyline points="4,24 10,24 14,14 18,34 22,20 26,28 30,18 34,30 38,24 44,24"
        stroke="white" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,

    arxiv: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#B31B1B"/>
      <text x="24" y="32" font-family="Arial,sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">arXiv</text>
    </svg>`,

    public_holidays: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#3949AB"/>
      <rect x="8" y="12" width="32" height="26" rx="3" fill="white" opacity="0.95"/>
      <rect x="8" y="12" width="32" height="9" rx="3" fill="#3949AB"/>
      <circle cx="16" cy="9" r="2.5" fill="white"/>
      <circle cx="32" cy="9" r="2.5" fill="white"/>
      <rect x="13" y="27" width="5" height="5" rx="1" fill="#3949AB" opacity="0.3"/>
      <rect x="21.5" y="27" width="5" height="5" rx="1" fill="#F44336"/>
      <rect x="30" y="27" width="5" height="5" rx="1" fill="#3949AB" opacity="0.3"/>
    </svg>`,

    sec_edgar: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#1A237E"/>
      <path d="M24 7 L38 15 L38 24 C38 32 31 39 24 41 C17 39 10 32 10 24 L10 15 Z" fill="white" opacity="0.15"/>
      <path d="M24 10 L36 17 L36 24 C36 31 30 37 24 39 C18 37 12 31 12 24 L12 17 Z" fill="white" opacity="0.9"/>
      <path d="M19 24 L22.5 27.5 L29 21" stroke="#1A237E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,

    world_bank: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#003087"/>
      <circle cx="24" cy="24" r="14" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
      <ellipse cx="24" cy="24" rx="6" ry="14" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
      <line x1="10" y1="24" x2="38" y2="24" stroke="white" stroke-width="2" opacity="0.7"/>
      <line x1="13" y1="16" x2="35" y2="16" stroke="white" stroke-width="1.5" opacity="0.5"/>
      <line x1="13" y1="32" x2="35" y2="32" stroke="white" stroke-width="1.5" opacity="0.5"/>
    </svg>`,
  };

  function renderIconCell(skill) {
    if (ICON_SVG[skill.id]) {
      return `<div class="w-11 h-11 flex items-center justify-center rounded-lg overflow-hidden">${ICON_SVG[skill.id]}</div>`;
    }
    return `<div class="w-11 h-11 rounded-lg bg-[#353534] flex items-center justify-center">
      <span class="material-symbols-outlined text-secondary text-2xl">${skill.icon}</span>
    </div>`;
  }

  function renderEnvNote(skill) {
    if (skill.status !== 'env_required') return '';
    const missing = Object.entries(skill.env_status || {})
      .filter(([, set]) => !set)
      .map(([key]) => `<code class="bg-surface-container-highest px-1 rounded text-[10px] font-mono text-yellow-400">${key}</code>`)
      .join(', ');
    return `<div class="mt-2">
      <p class="font-label text-[10px] text-yellow-400 flex items-center gap-1 mb-1">
        <span class="material-symbols-outlined text-[12px]">key</span>API 키 미설정: ${missing}
      </p>
    </div>`;
  }

  function renderCard(skill) {
    const cfg = STATUS_CFG[skill.status] || STATUS_CFG.connected;
    const f = getFriendly(skill);
    const googleNote = skill.requires_google && skill.status === 'auth_required'
      ? '<p class="font-label text-[10px] text-error mt-2">Google credentials 또는 token 필요</p>' : '';
    const hubNote = skill.source === 'hub'
      ? '<p class="font-label text-[10px] text-secondary mt-2 flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">cloud_done</span>허브에서 설치됨</p>'
      : skill.source === 'ai_generated'
      ? '<p class="font-label text-[10px] text-tertiary mt-2 flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">auto_awesome</span>AI가 자동 생성한 스킬</p>'
      : '';
    const envNote = renderEnvNote(skill);
    const isActive = skill.status === 'connected' || skill.status === 'hub_installed' || skill.status === 'ai_generated';
    const ringClass = skill.status === 'env_required' ? ' ring-1 ring-yellow-500/30'
      : skill.source === 'hub' ? ' ring-1 ring-secondary/20'
      : skill.source === 'ai_generated' ? ' ring-1 ring-tertiary/20' : '';

    // ⚠️ 버튼에 data-* 속성 사용 — onclick 내부에서 JSON 따옴표 충돌 방지
    const envBtn = skill.status === 'env_required'
      ? `<button
           class="btn-open-env flex items-center gap-1 px-2 py-1 rounded bg-yellow-500/15 text-yellow-400 font-label text-[10px] font-bold uppercase tracking-tight hover:bg-yellow-500/25 transition-colors"
           data-skill-id="${skill.id}"
           data-env-keys="${encodeURIComponent(JSON.stringify(skill.requires_env || []))}"
           data-env-status="${encodeURIComponent(JSON.stringify(skill.env_status || {}))}">
           <span class="material-symbols-outlined text-[12px]">key</span>API 키 등록
         </button>`
      : `<span class="material-symbols-outlined text-on-surface-variant text-sm ${isActive?'hover:text-primary cursor-pointer':'cursor-not-allowed'}">${cfg.syncIcon}</span>`;

    return `<div class="bg-surface-container-low p-5 rounded-xl flex flex-col justify-between group hover:scale-[1.01] transition-transform${ringClass}">
      <div class="flex justify-between items-start mb-5">
        ${renderIconCell(skill)}
        <span class="font-label text-[10px] font-bold uppercase tracking-tighter ${cfg.badge} px-2 py-1 rounded">${cfg.label}</span>
      </div>
      <div>
        <h3 class="font-headline text-lg font-bold text-on-surface mb-1">${f.name}</h3>
        <p class="font-body text-sm text-on-surface-variant mb-3">${f.desc}</p>
        ${googleNote}${hubNote}${envNote}
      </div>
      <div class="flex items-center justify-between pt-3 border-t border-outline-variant/10 mt-auto">
        ${envBtn}
        <span class="font-label text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">${skill.id}</span>
      </div>
    </div>`;
  }

  async function loadSkills() {
    try {
      const res = await fetch('/api/skills');
      const data = await res.json();
      const skills = data.skills || [];
      if (!skills.length) {
        $('skills-grid').innerHTML = '<div class="col-span-full text-center py-12"><span class="material-symbols-outlined text-outline text-5xl mb-4">extension_off</span><p class="font-headline text-lg text-on-surface-variant">설치된 스킬이 없습니다</p></div>';
        return;
      }
      $('skills-grid').innerHTML = skills.map(renderCard).join('');
      $('cnt-total').textContent = skills.length;
      $('cnt-connected').textContent = skills.filter(s=>s.status==='connected').length;
      $('cnt-auth').textContent = skills.filter(s=>s.status==='auth_required').length;
      $('cnt-disabled').textContent = skills.filter(s=>s.status==='disabled').length;
      const hubEl = $('cnt-hub');
      if (hubEl) hubEl.textContent = skills.filter(s=>s.source==='hub').length;
      const aiEl = $('cnt-ai');
      if (aiEl) aiEl.textContent = skills.filter(s=>s.source==='ai_generated').length;
      $('skills-summary').classList.remove('hidden');
    } catch(e) {
      $('skills-grid').innerHTML = `<div class="col-span-full text-center py-12"><span class="material-symbols-outlined text-error text-5xl mb-4">error</span><p class="font-headline text-lg text-error">로드 실패</p><p class="font-body text-sm text-on-surface-variant mt-2">${e.message}</p></div>`;
    }
  }
  loadSkills();

  // ── API 키 등록 모달 ────────────────────────────────────────────────────────
  let _modalSkillId = '';
  let _modalEnvKeys = [];
  let _modalEnvStatus = {};

  const _ENV_DOCS = {
    youtube:   { url: 'https://console.cloud.google.com/', label: 'Google Cloud Console → YouTube Data API v3 활성화' },
    weather:   { url: 'https://openweathermap.org/api',    label: 'OpenWeatherMap 무료 API 키 발급' },
    news_api:  { url: 'https://newsapi.org/',              label: 'NewsAPI 무료 플랜 가입' },
    serpapi:   { url: 'https://serpapi.com/',              label: 'SerpAPI 키 발급' },
  };

  function openEnvModal(skillId, envKeys, envStatus) {
    _modalSkillId = skillId;
    _modalEnvKeys = envKeys;
    _modalEnvStatus = envStatus;

    $('modal-skill-name').textContent = skillId;
    $('modal-save-status').textContent = '';

    const container = $('modal-env-fields');
    container.innerHTML = envKeys.map(key => {
      const isSet = envStatus[key];
      return `<div class="mb-4">
        <label class="block font-label text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1">
          ${key}
          ${isSet ? '<span class="ml-2 text-primary text-[10px] normal-case tracking-normal font-normal">✓ 설정됨</span>' : '<span class="ml-2 text-yellow-400 text-[10px] normal-case tracking-normal font-normal">미설정</span>'}
        </label>
        <div class="relative">
          <input id="env-input-${key}" type="password"
            placeholder="${isSet ? '새 값 입력 (변경 시에만)' : '발급받은 API 키를 입력하세요'}"
            class="w-full bg-surface-container-highest border border-outline-variant/30 rounded-lg px-3 py-2.5 text-sm font-mono text-on-surface placeholder:text-outline focus:outline-none focus:border-yellow-500/60 focus:ring-1 focus:ring-yellow-500/30 pr-10"/>
          <button type="button" data-toggle-pw="env-input-${key}"
            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors">
            <span class="material-symbols-outlined text-base">visibility</span>
          </button>
        </div>
      </div>`;
    }).join('');

    const docsLink = _ENV_DOCS[skillId];
    const docsEl = $('modal-docs-link');
    if (docsLink) {
      docsEl.innerHTML = `<a href="${docsLink.url}" target="_blank" rel="noopener"
        class="flex items-center gap-1 text-secondary text-[11px] hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[13px]">open_in_new</span>${docsLink.label}
      </a>`;
      docsEl.classList.remove('hidden');
    } else {
      docsEl.classList.add('hidden');
    }

    const btn = $('btn-save-env');
    btn.disabled = false;
    btn.innerHTML = `<span class="material-symbols-outlined text-sm">save</span> 저장`;

    $('env-modal').classList.remove('hidden');
    $('env-modal').classList.add('flex');
    setTimeout(() => $('modal-panel').classList.remove('scale-95', 'opacity-0'), 10);
  }

  function closeEnvModal() {
    $('modal-panel').classList.add('scale-95', 'opacity-0');
    setTimeout(() => {
      $('env-modal').classList.add('hidden');
      $('env-modal').classList.remove('flex');
    }, 200);
  }

  // 이벤트 위임 — 동적으로 생성된 버튼들을 처리
  document.addEventListener('click', e => {
    // "API 키 등록" 버튼 (data-* 방식)
    const envBtn = e.target.closest('.btn-open-env');
    if (envBtn) {
      const skillId = envBtn.dataset.skillId;
      const envKeys = JSON.parse(decodeURIComponent(envBtn.dataset.envKeys));
      const envStatus = JSON.parse(decodeURIComponent(envBtn.dataset.envStatus));
      openEnvModal(skillId, envKeys, envStatus);
      return;
    }
    // 비밀번호 토글 버튼
    const toggleBtn = e.target.closest('[data-toggle-pw]');
    if (toggleBtn) {
      const inputId = toggleBtn.dataset.togglePw;
      const input = document.getElementById(inputId);
      const icon = toggleBtn.querySelector('span');
      if (input) {
        input.type = input.type === 'password' ? 'text' : 'password';
        icon.textContent = input.type === 'password' ? 'visibility' : 'visibility_off';
      }
      return;
    }
    // 모달 바깥 클릭
    if (e.target === $('env-modal')) closeEnvModal();
  });

  $('btn-close-modal').addEventListener('click', closeEnvModal);
  $('btn-cancel-modal').addEventListener('click', closeEnvModal);

  $('btn-save-env').addEventListener('click', async () => {
    const btn = $('btn-save-env');
    const statusEl = $('modal-save-status');

    // 유효성 검사
    let hasError = false;
    for (const key of _modalEnvKeys) {
      const input = document.getElementById(`env-input-${key}`);
      if (input) input.classList.remove('border-error');
      const value = input ? input.value.trim() : '';
      if (!value && !_modalEnvStatus[key]) {
        if (input) input.classList.add('border-error', 'border-red-500/60');
        hasError = true;
      }
    }
    if (hasError) {
      statusEl.textContent = '필수 API 키를 모두 입력해 주세요.';
      statusEl.className = 'text-error text-xs font-label mt-2';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined text-sm animate-spin">progress_activity</span> 저장 중...`;
    statusEl.textContent = '';

    let savedCount = 0;
    for (const key of _modalEnvKeys) {
      const input = document.getElementById(`env-input-${key}`);
      const value = input ? input.value.trim() : '';
      if (!value) continue;
      try {
        const res = await fetch(`/api/skills/${_modalSkillId}/env`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ env_key: key, env_value: value }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || '저장 실패');
        }
        savedCount++;
      } catch(e) {
        statusEl.textContent = `저장 실패: ${e.message}`;
        statusEl.className = 'text-error text-xs font-label mt-2';
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-sm">save</span> 저장`;
        return;
      }
    }

    btn.innerHTML = `<span class="material-symbols-outlined text-sm text-primary">check_circle</span> 저장됨`;
    statusEl.textContent = `✓ ${savedCount}개 키가 ~/.openchiken/.env에 저장되었습니다.`;
    statusEl.className = 'text-primary text-xs font-label mt-2';

    setTimeout(async () => {
      closeEnvModal();
      await loadSkills();
    }, 1400);
  });

  $('btn-reload-skills').addEventListener('click', async () => {
    const btn = $('btn-reload-skills');
    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined text-base animate-spin">progress_activity</span> 재로드 중...`;
    try {
      const res = await fetch('/api/skills/reload', { method: 'POST' });
      const data = await res.json();
      await loadSkills();
      btn.innerHTML = `<span class="material-symbols-outlined text-base text-secondary">check_circle</span> ${data.message || '완료'}`;
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-base">refresh</span> 스킬 재로드`;
      }, 2500);
    } catch (e) {
      btn.innerHTML = `<span class="material-symbols-outlined text-base text-error">error</span> 실패`;
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-base">refresh</span> 스킬 재로드`;
      }, 2500);
    }
  });
})();
</script>
</body></html>
