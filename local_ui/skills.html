<!DOCTYPE html>
<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenChiken | Skills</title>
<link rel="icon" type="image/png" href="/static/assets/logo.png"/>
<link href="/static/shared.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {
      "surface-container-low":"#1c1b1b","on-surface-variant":"#c6c5d4","surface-container-lowest":"#0e0e0e",
      "secondary":"#bbc3ff","on-primary-container":"#00a7ba","surface-bright":"#393939","primary-fixed":"#9cf0ff",
      "surface-container-highest":"#353534","on-secondary-container":"#b6beff","surface-dim":"#131313",
      "on-primary":"#00363d","inverse-on-surface":"#313030","error":"#ffb4ab","on-surface":"#e5e2e1",
      "outline-variant":"#454652","primary-fixed-dim":"#00daf3","surface-variant":"#353534",
      "background":"#131313","on-background":"#e5e2e1","surface":"#131313","on-secondary":"#001c95",
      "primary":"#00daf3","primary-container":"#00363d","on-error-container":"#ffdad6","outline":"#908f9d",
      "surface-container-high":"#2a2a2a","secondary-container":"#0031e8","surface-tint":"#00daf3",
      "surface-container":"#201f1f","tertiary":"#49d7f4","error-container":"#93000a"
    },
    fontFamily: { "headline":["Space Grotesk"],"body":["Inter"],"label":["Manrope"] },
    borderRadius: {"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},
  }}
}
</script>
</head>
<body class="bg-background text-on-surface font-body">
<main>
<header class="mb-8">
<div class="flex items-center justify-between gap-4 flex-wrap">
  <div>
    <h1 class="text-3xl font-headline font-bold tracking-tight text-on-surface">Skills</h1>
    <p class="text-on-surface-variant font-body text-sm">설치된 스킬 목록과 연결 상태를 확인합니다.</p>
  </div>
  <button id="btn-reload-skills"
    class="flex items-center gap-2 px-4 py-2 rounded-xl bg-surface-container-highest font-label font-bold text-xs uppercase tracking-widest text-on-surface hover:bg-primary/10 hover:text-primary transition-all">
    <span class="material-symbols-outlined text-base">refresh</span>
    스킬 재로드
  </button>
</div>
</header>

<!-- Skills Grid -->
<div id="skills-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-12">
<div class="skeleton-block h-48"></div>
<div class="skeleton-block h-48"></div>
<div class="skeleton-block h-48"></div>
<div class="skeleton-block h-48"></div>
<div class="skeleton-block h-48"></div>
<div class="skeleton-block h-48"></div>
</div>

<!-- Summary -->
<div id="skills-summary" class="hidden">
<div class="flex items-center gap-4 mb-6">
<h2 class="font-headline text-xl font-bold text-on-surface">요약</h2>
<div class="h-[1px] flex-grow bg-outline-variant/20"></div>
</div>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
<div class="bg-surface-container-low rounded-xl p-5 text-center">
<p id="cnt-total" class="font-headline text-3xl font-bold text-primary">0</p>
<p class="font-label text-[10px] uppercase tracking-wider text-on-surface-variant mt-1">전체</p>
</div>
<div class="bg-surface-container-low rounded-xl p-5 text-center">
<p id="cnt-connected" class="font-headline text-3xl font-bold text-primary">0</p>
<p class="font-label text-[10px] uppercase tracking-wider text-on-surface-variant mt-1">연결됨</p>
</div>
<div class="bg-surface-container-low rounded-xl p-5 text-center">
<p id="cnt-auth" class="font-headline text-3xl font-bold text-error">0</p>
<p class="font-label text-[10px] uppercase tracking-wider text-on-surface-variant mt-1">인증 필요</p>
</div>
<div class="bg-surface-container-low rounded-xl p-5 text-center">
<p id="cnt-disabled" class="font-headline text-3xl font-bold text-outline">0</p>
<p class="font-label text-[10px] uppercase tracking-wider text-on-surface-variant mt-1">비활성</p>
</div>
</div>
</div>
</main>

<script src="/static/shared.js"></script>
<script>
(function() {
  const $ = id => document.getElementById(id);

  const STATUS_CFG = {
    connected:     { label:'연결됨',      badge:'bg-primary/10 text-primary',                syncIcon:'sync' },
    auth_required: { label:'인증 필요',    badge:'bg-error-container/20 text-error',           syncIcon:'sync_disabled' },
    disabled:      { label:'비활성',       badge:'bg-surface-container-highest text-outline',   syncIcon:'sync_disabled' },
  };

  const FRIENDLY = {
    gmail:      { name:'Gmail',        desc:'이메일 검색, 읽기, 전송' },
    calendar:   { name:'Calendar',     desc:'일정 조회, 생성, 삭제' },
    drive:      { name:'Google Drive', desc:'파일 검색, 읽기, 업로드, 폴더 관리' },
    sheets:     { name:'Google Sheets',desc:'스프레드시트 읽기, 쓰기, 행 추가' },
    docs:       { name:'Google Docs',  desc:'문서 읽기, 생성, 텍스트 편집' },
    weather:    { name:'Weather',      desc:'현재 날씨 및 예보 조회' },
    web_search: { name:'Web Search',   desc:'실시간 웹 검색' },
    memo:       { name:'Memo',         desc:'메모 저장, 조회, 삭제' },
    task:       { name:'Task',         desc:'태스크 생성 및 진행 관리' },
    finance:    { name:'Finance',      desc:'주식, 암호화폐, 지수 시세 조회' },
    workflow:   { name:'Workflow',     desc:'Gmail·Calendar·Drive 복합 자동화' },
  };

  const ICON_SVG = {
    gmail: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 193" width="36" height="27">
      <path fill="#4285F4" d="M58.182 192.05V93.14L27.507 65.077 0 49.419v125.934c0 9.22 7.474 16.697 16.697 16.697"/>
      <path fill="#34A853" d="M197.818 192.05h39.484c9.22 0 16.698-7.477 16.698-16.697V49.419l-32.054 23.21"/>
      <path fill="#FBBC05" d="M197.818 17.504V93.14L256 49.419V26.181C256 3.658 235.015-9.068 215.738 5.653"/>
      <path fill="#EA4335" d="M0 49.419l26.759 20.07L58.182 93.14V17.504L40.297 5.654C21.01-9.068 0 3.657 0 26.18"/>
      <path fill="#C5221F" d="M58.182 93.14l-4.174-38.647 4.174-36.989 99.818 74.864 99.818-74.864 4.69 33.302-4.69 42.334L158 167.998"/>
    </svg>`,
    calendar: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="40" height="40" style="border-radius:6px;overflow:hidden">
      <rect width="48" height="48" rx="4" fill="white"/>
      <rect y="0" width="48" height="14" rx="4" fill="#1a73e8"/>
      <rect y="10" width="48" height="4" fill="#1a73e8"/>
      <circle cx="16" cy="7" r="2.5" fill="white" opacity="0.75"/>
      <circle cx="32" cy="7" r="2.5" fill="white" opacity="0.75"/>
      <text x="24" y="37" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1a73e8" text-anchor="middle">31</text>
    </svg>`,
    drive: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 87.3 78" width="38" height="34">
      <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
      <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0-1.2 4.5h27.5z" fill="#00ac47"/>
      <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
      <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
      <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
      <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
    </svg>`,
    sheets: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="36" height="36">
      <path d="M8 4h22l10 10v30H8z" fill="#34a853"/>
      <path d="M30 4l10 10H30z" fill="#188038"/>
      <rect x="12" y="19" width="24" height="2" rx="1" fill="white" opacity="0.9"/>
      <rect x="12" y="24" width="24" height="2" rx="1" fill="white" opacity="0.9"/>
      <rect x="12" y="29" width="24" height="2" rx="1" fill="white" opacity="0.9"/>
      <rect x="12" y="34" width="24" height="2" rx="1" fill="white" opacity="0.9"/>
      <rect x="21" y="17" width="2" height="21" rx="1" fill="white" opacity="0.5"/>
      <rect x="30" y="17" width="2" height="21" rx="1" fill="white" opacity="0.5"/>
    </svg>`,
    docs: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="36" height="36">
      <path d="M8 4h22l10 10v30H8z" fill="#4285f4"/>
      <path d="M30 4l10 10H30z" fill="#1a56c0"/>
      <rect x="12" y="19" width="24" height="2" rx="1" fill="white" opacity="0.9"/>
      <rect x="12" y="24" width="24" height="2" rx="1" fill="white" opacity="0.9"/>
      <rect x="12" y="29" width="24" height="2" rx="1" fill="white" opacity="0.9"/>
      <rect x="12" y="34" width="16" height="2" rx="1" fill="white" opacity="0.9"/>
    </svg>`,
    weather: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#039BE5"/>
      <circle cx="19" cy="19" r="7" fill="#FFD740"/>
      <rect x="17.5" y="7" width="3" height="5" rx="1.5" fill="#FFD740"/>
      <rect x="26.5" y="17.5" width="5" height="3" rx="1.5" fill="#FFD740"/>
      <rect x="8" y="17.5" width="5" height="3" rx="1.5" fill="#FFD740"/>
      <ellipse cx="31" cy="34" rx="9" ry="6" fill="white" opacity="0.95"/>
      <ellipse cx="23" cy="35.5" rx="7" ry="5.5" fill="white" opacity="0.95"/>
      <ellipse cx="27" cy="30" rx="7" ry="6" fill="white" opacity="0.95"/>
    </svg>`,
    web_search: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#FF6D00"/>
      <circle cx="21" cy="21" r="9" fill="none" stroke="white" stroke-width="3.5"/>
      <line x1="27.5" y1="28" x2="37" y2="37.5" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    </svg>`,
    memo: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#FFB300"/>
      <path d="M11 9h22l6 6v26H11z" fill="white" opacity="0.95"/>
      <path d="M33 9l6 6h-6z" fill="#E65100" opacity="0.2"/>
      <rect x="15" y="19" width="18" height="2" rx="1" fill="#FFB300" opacity="0.65"/>
      <rect x="15" y="24" width="18" height="2" rx="1" fill="#FFB300" opacity="0.65"/>
      <rect x="15" y="29" width="12" height="2" rx="1" fill="#FFB300" opacity="0.65"/>
      <path d="M31 33 l5-5 3 3 -5 5z" fill="#E65100" opacity="0.6"/>
      <line x1="31" y1="33" x2="27.5" y2="37.5" stroke="#E65100" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
    </svg>`,
    task: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#651FFF"/>
      <rect x="9" y="12" width="10" height="10" rx="2" fill="white" opacity="0.9"/>
      <path d="M11.5 17 L14 20.5 L19.5 14" stroke="#651FFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="23" y="15" width="16" height="2.5" rx="1.25" fill="white" opacity="0.8"/>
      <rect x="9" y="27" width="10" height="10" rx="2" fill="white" opacity="0.9"/>
      <path d="M11.5 32 L14 35.5 L19.5 29" stroke="#651FFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="23" y="30" width="16" height="2.5" rx="1.25" fill="white" opacity="0.8"/>
    </svg>`,
    finance: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#00897B"/>
      <rect x="8" y="28" width="7" height="12" rx="1.5" fill="white" opacity="0.9"/>
      <rect x="11" y="22" width="1.5" height="6" rx="0.75" fill="white" opacity="0.65"/>
      <rect x="20.5" y="20" width="7" height="16" rx="1.5" fill="white" opacity="0.9"/>
      <rect x="23.5" y="14" width="1.5" height="6" rx="0.75" fill="white" opacity="0.65"/>
      <rect x="33" y="11" width="7" height="22" rx="1.5" fill="white" opacity="0.9"/>
      <rect x="36" y="7" width="1.5" height="4" rx="0.75" fill="white" opacity="0.65"/>
      <path d="M11.5 36 L24 27 L36.5 19" stroke="#A5D6A7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,
    workflow: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38">
      <rect width="48" height="48" rx="10" fill="#00796B"/>
      <circle cx="11" cy="24" r="5.5" fill="white" opacity="0.95"/>
      <circle cx="37" cy="11" r="5.5" fill="white" opacity="0.95"/>
      <circle cx="37" cy="37" r="5.5" fill="white" opacity="0.95"/>
      <line x1="16.5" y1="21.5" x2="31.5" y2="13.5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <line x1="16.5" y1="26.5" x2="31.5" y2="34.5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </svg>`,
  };

  function renderIconCell(skill) {
    if (ICON_SVG[skill.id]) {
      const isCalendar = skill.id === 'calendar';
      const wrap = isCalendar
        ? 'w-11 h-11 rounded-lg overflow-hidden flex items-center justify-center'
        : 'w-11 h-11 flex items-center justify-center';
      return `<div class="${wrap}">${ICON_SVG[skill.id]}</div>`;
    }
    return `<div class="w-11 h-11 rounded-lg bg-[#353534] flex items-center justify-center">
      <span class="material-symbols-outlined text-secondary text-2xl">${skill.icon}</span>
    </div>`;
  }

  function renderCard(skill) {
    const cfg = STATUS_CFG[skill.status] || STATUS_CFG.connected;
    const f = FRIENDLY[skill.id] || { name: skill.name, desc: skill.description };
    const googleNote = skill.requires_google && skill.status === 'auth_required'
      ? '<p class="font-label text-[10px] text-error mt-2">Google credentials 또는 token 필요</p>' : '';
    return `<div class="bg-surface-container-low p-5 rounded-xl flex flex-col justify-between group hover:scale-[1.01] transition-transform">
      <div class="flex justify-between items-start mb-5">
        ${renderIconCell(skill)}
        <span class="font-label text-[10px] font-bold uppercase tracking-tighter ${cfg.badge} px-2 py-1 rounded">${cfg.label}</span>
      </div>
      <div>
        <h3 class="font-headline text-lg font-bold text-on-surface mb-1">${f.name}</h3>
        <p class="font-body text-sm text-on-surface-variant mb-3">${f.desc}</p>
        ${googleNote}
      </div>
      <div class="flex items-center justify-between pt-3 border-t border-outline-variant/10 mt-auto">
        <span class="material-symbols-outlined text-on-surface-variant text-sm ${skill.status==='connected'?'hover:text-primary cursor-pointer':'cursor-not-allowed'}">${cfg.syncIcon}</span>
        <span class="font-label text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">${skill.id}</span>
      </div>
    </div>`;
  }

  async function loadSkills() {
    try {
      const res = await fetch('/api/skills');
      const data = await res.json();
      const skills = data.skills || [];
      if (!skills.length) {
        $('skills-grid').innerHTML = '<div class="col-span-full text-center py-12"><span class="material-symbols-outlined text-outline text-5xl mb-4">extension_off</span><p class="font-headline text-lg text-on-surface-variant">설치된 스킬이 없습니다</p></div>';
        return;
      }
      $('skills-grid').innerHTML = skills.map(renderCard).join('');
      $('cnt-total').textContent = skills.length;
      $('cnt-connected').textContent = skills.filter(s=>s.status==='connected').length;
      $('cnt-auth').textContent = skills.filter(s=>s.status==='auth_required').length;
      $('cnt-disabled').textContent = skills.filter(s=>s.status==='disabled').length;
      $('skills-summary').classList.remove('hidden');
    } catch(e) {
      $('skills-grid').innerHTML = `<div class="col-span-full text-center py-12"><span class="material-symbols-outlined text-error text-5xl mb-4">error</span><p class="font-headline text-lg text-error">로드 실패</p><p class="font-body text-sm text-on-surface-variant mt-2">${e.message}</p></div>`;
    }
  }
  loadSkills();

  document.getElementById('btn-reload-skills').addEventListener('click', async () => {
    const btn = document.getElementById('btn-reload-skills');
    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined text-base animate-spin">progress_activity</span> 재로드 중...`;
    try {
      const res = await fetch('/api/skills/reload', { method: 'POST' });
      const data = await res.json();
      await loadSkills();
      btn.innerHTML = `<span class="material-symbols-outlined text-base text-secondary">check_circle</span> ${data.message || '완료'}`;
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-base">refresh</span> 스킬 재로드`;
      }, 2500);
    } catch (e) {
      btn.innerHTML = `<span class="material-symbols-outlined text-base text-error">error</span> 실패`;
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-base">refresh</span> 스킬 재로드`;
      }, 2500);
    }
  });
})();
</script>
</body></html>
