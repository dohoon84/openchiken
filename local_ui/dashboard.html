<!-- Agent Registry -->

<script src="/static/shared.js"></script>
<script>
let _botRunning = false;

function setBotControlBtn(running) {
  _botRunning = running;
  const btn = document.getElementById('bot-control-btn');
  const icon = document.getElementById('bot-control-icon');
  const label = document.getElementById('bot-control-label');
  const pulse = document.getElementById('engine-pulse');
  btn.classList.remove('hidden');
  if (running) {
    btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[11px] font-bold uppercase tracking-wide transition-all bg-error/10 text-error border border-error/20 hover:bg-error/20';
    icon.textContent = 'stop_circle';
    label.textContent = 'Stop';
    pulse.className = 'w-2 h-2 rounded-full bg-primary animate-pulse';
  } else {
    btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[11px] font-bold uppercase tracking-wide transition-all bg-primary/10 text-primary border border-primary/20 hover:bg-primary/20';
    icon.textContent = 'play_circle';
    label.textContent = 'Start';
    pulse.className = 'w-2 h-2 rounded-full bg-outline-variant';
  }
}

async function toggleBot() {
  const btn = document.getElementById('bot-control-btn');
  btn.disabled = true;
  try {
    if (_botRunning) {
      await fetch('/api/system/stop', { method: 'POST' });
      setBotControlBtn(false);
      document.getElementById('engine-title').textContent = 'Engine Offline';
      document.getElementById('engine-badge').textContent = 'Offline';
      document.getElementById('engine-badge').className = 'bg-outline-variant/20 text-on-surface-variant border border-outline-variant/20 px-3 py-1 rounded-full text-[10px] font-bold uppercase';
      document.getElementById('engine-log').innerHTML = '<p class="text-on-surface-variant/50">봇이 중지되었습니다.</p>';
      document.getElementById('ai-core-status').textContent = 'Stopped';
    } else {
      await fetch('/api/system/start', { method: 'POST' });
      setBotControlBtn(true);
      document.getElementById('engine-title').textContent = '시작 중...';
      document.getElementById('engine-badge').textContent = 'Starting';
      document.getElementById('engine-log').innerHTML = '<p class="text-primary/60">main.py 시작 중...</p>';
      setTimeout(() => location.reload(), 3000);
    }
  } catch (e) {
    console.error('봇 제어 실패:', e);
  } finally {
    btn.disabled = false;
  }
}

(async function loadDashboard() {
  const API = '/api/dashboard';
  async function fetchJSON(url) {
    const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }
  function $(id) { return document.getElementById(id); }
  function clearSkeleton(ids) { ids.forEach(id => { const el = $(id); if (el) el.classList.remove('skeleton'); }); }

  const [agentRes, weatherRes, calendarRes, gmailRes, memoryRes, botStatusRes] = await Promise.allSettled([
    fetchJSON(`${API}/agent-status`),
    fetchJSON(`${API}/weather?city=Seoul`),
    fetchJSON(`${API}/calendar`),
    fetchJSON(`${API}/gmail?max_results=5`),
    fetchJSON(`${API}/memory?limit=6`),
    fetchJSON('/api/system/status'),
  ]);

  // Agent Registry 비동기 로드
  loadAgentRegistry();

  clearSkeleton(['engine-title','engine-badge','ai-model-name','ai-provider','ai-core-status',
    'weather-city','weather-condition','weather-temp','weather-temp-min','weather-humidity','weather-wind','inbox-badge']);

  const botRunning = botStatusRes.status === 'fulfilled' && botStatusRes.value.running;
  setBotControlBtn(botRunning);

  if (agentRes.status === 'fulfilled') {
    const d = agentRes.value;
    $('ai-model-name').textContent = d.model;
    $('ai-provider').textContent = d.provider;
    $('ai-core-status').textContent = 'Active';
    $('engine-title').textContent = `${d.assistant_name} — ${d.provider} Engine`;
    $('engine-badge').textContent = 'Online';
    const logEl = $('engine-log');
    if (logEl) {
      const skills = d.enabled_skills === 'all' ? 'All Skills' : d.enabled_skills;
      const channels = Array.isArray(d.enabled_channels) ? d.enabled_channels.join(', ') : d.enabled_channels;
      logEl.innerHTML = `
        <p class="text-on-surface-variant/40 line-through">System initialization... [DONE]</p>
        <p class="text-on-surface-variant/60">Active skills: ${skills}</p>
        <p class="text-primary font-bold">Channels: ${channels} — Ready</p>`;
    }
  } else {
    $('engine-title').textContent = 'Engine Offline';
    $('engine-badge').textContent = 'Offline';
    $('engine-badge').className = 'bg-outline-variant/20 text-on-surface-variant border border-outline-variant/20 px-3 py-1 rounded-full text-[10px] font-bold uppercase';
    $('ai-core-status').textContent = 'Disconnected';
  }

  if (weatherRes.status === 'fulfilled' && !weatherRes.value.error) {
    const w = weatherRes.value;
    $('weather-city').textContent = w.city;
    $('weather-condition').textContent = w.condition;
    $('weather-icon').textContent = w.icon;
    $('weather-temp').textContent = `${Math.round(w.temp)}°`;
    $('weather-temp-min').textContent = w.temp_min != null ? `/ ${Math.round(w.temp_min)}°` : '';
    $('weather-humidity').textContent = `${w.humidity}%`;
    $('weather-wind').textContent = `${w.windspeed}km/h`;
  }

  const scheduleEl = $('schedule-list');
  if (scheduleEl && calendarRes.status === 'fulfilled') {
    const cal = calendarRes.value;
    if (cal.events && cal.events.length > 0) {
      scheduleEl.innerHTML = cal.events.map((ev, i) => {
        const isLast = i === cal.events.length - 1;
        return `<div class="flex gap-4">
          <div class="flex flex-col items-center">
            <span class="text-xs font-bold text-primary">${ev.time}</span>
            ${!isLast ? '<div class="w-px h-full bg-outline-variant/30 my-1"></div>' : ''}
          </div>
          <div class="${!isLast ? 'pb-3' : ''}">
            <p class="text-sm font-medium text-on-surface">${ev.title}</p>
            <p class="text-xs text-on-surface-variant">${ev.description || ''}</p>
          </div>
        </div>`;
      }).join('');
    } else if (cal.error) {
      scheduleEl.innerHTML = `<div class="flex items-center gap-2 text-on-surface-variant/60 py-4"><span class="material-symbols-outlined text-sm">cloud_off</span><p class="text-xs font-label">Google Calendar 미연결</p></div>`;
    } else {
      scheduleEl.innerHTML = `<div class="flex items-center gap-2 text-on-surface-variant/60 py-4"><span class="material-symbols-outlined text-sm">event_available</span><p class="text-xs font-label">오늘 일정이 없습니다</p></div>`;
    }
  }

  const inboxEl = $('inbox-list');
  const badgeEl = $('inbox-badge');
  if (inboxEl && gmailRes.status === 'fulfilled') {
    const gm = gmailRes.value;
    if (badgeEl) {
      badgeEl.textContent = gm.unread_count > 0 ? `${gm.unread_count} NEW` : '0';
      if (gm.unread_count === 0) { badgeEl.className = 'bg-outline-variant/30 text-on-surface-variant px-2 py-0.5 rounded text-[10px] font-bold'; }
    }
    if (gm.messages && gm.messages.length > 0) {
      inboxEl.innerHTML = gm.messages.map(msg => `
        <div class="p-3 bg-surface-container-low rounded-lg hover:bg-surface-container-high transition-colors cursor-pointer group">
          <div class="flex justify-between items-start mb-1">
            <p class="text-xs font-bold text-secondary">${msg.from}</p>
            <span class="text-[10px] text-on-surface-variant">${msg.date}</span>
          </div>
          <p class="text-sm font-medium text-on-surface group-hover:text-primary transition-colors">${msg.subject}</p>
        </div>`).join('');
    } else if (gm.error) {
      inboxEl.innerHTML = `<div class="flex items-center gap-2 text-on-surface-variant/60 py-4"><span class="material-symbols-outlined text-sm">cloud_off</span><p class="text-xs font-label">Gmail 미연결</p></div>`;
    } else {
      inboxEl.innerHTML = `<div class="flex items-center gap-2 text-on-surface-variant/60 py-4"><span class="material-symbols-outlined text-sm">mark_email_read</span><p class="text-xs font-label">읽지 않은 메일이 없습니다</p></div>`;
    }
  }

  const memoryEl = $('memory-list');
  if (memoryEl && memoryRes.status === 'fulfilled') {
    const mem = memoryRes.value;
    const items = [];
    const borders = ['border-primary/40','border-secondary/40','border-tertiary/40'];
    if (mem.memos) mem.memos.forEach((m,i) => items.push({ content: `${m.title}: ${m.content}`, label: 'Memo', tag: 'Saved', time: m.created_at||'', border: borders[i%3] }));
    if (mem.messages) mem.messages.forEach((m,i) => items.push({ content: m.content, label: m.type==='human'?'User':'AI', tag: m.type==='human'?'Query':'Response', time:'', border: borders[(i+1)%3] }));
    const display = items.slice(0, 3);
    if (display.length > 0) {
      memoryEl.innerHTML = display.map(item => `
        <div class="p-4 bg-surface-container-low rounded-lg border-l-2 ${item.border}">
          <p class="text-[10px] text-on-surface-variant font-label uppercase tracking-tighter mb-1">${item.time || 'Recent'}</p>
          <p class="text-sm font-medium text-on-surface mb-2">${item.content}</p>
          <div class="flex gap-2">
            <span class="px-2 py-0.5 bg-surface-container-highest text-[9px] rounded uppercase font-bold text-on-surface-variant">${item.label}</span>
            <span class="px-2 py-0.5 bg-surface-container-highest text-[9px] rounded uppercase font-bold text-on-surface-variant">${item.tag}</span>
          </div>
        </div>`).join('');
    } else {
      memoryEl.innerHTML = `<div class="md:col-span-3 flex items-center gap-2 text-on-surface-variant/60 py-4"><span class="material-symbols-outlined text-sm">memory</span><p class="text-xs font-label">아직 기록된 대화가 없습니다</p></div>`;
    }
  }
})();

// ─────────── Agent Registry ───────────

const TRUST_STYLE = {
  platform_verified:  { label: 'Platform Verified', bg: 'rgba(0,218,243,0.12)', color: '#00daf3', icon: 'verified' },
  community_verified: { label: 'Community',          bg: 'rgba(73,215,244,0.12)', color: '#49d7f4', icon: 'groups' },
  unverified:         { label: 'Unverified',         bg: 'rgba(144,143,157,0.15)', color: '#908f9d', icon: 'help' },
};

const DOMAIN_COLOR = [
  'rgba(0,218,243,0.12)', 'rgba(187,195,255,0.12)', 'rgba(73,215,244,0.12)',
  'rgba(255,180,171,0.12)', 'rgba(234,179,8,0.12)',
];
const DOMAIN_TEXT = ['#00daf3', '#bbc3ff', '#49d7f4', '#ffb4ab', '#eab308'];

function domainTag(cap, idx) {
  const ci = idx % DOMAIN_COLOR.length;
  return `<span class="px-2 py-0.5 rounded text-[10px] font-bold font-label uppercase tracking-wide"
    style="background:${DOMAIN_COLOR[ci]};color:${DOMAIN_TEXT[ci]};">${cap}</span>`;
}

function reputationBar(rep) {
  if (!rep || rep.count === 0) {
    return `<span class="text-[11px] font-label text-on-surface-variant/50">평판 없음</span>`;
  }
  const avg = rep.average ?? 0;
  const pct = Math.min(100, Math.max(0, avg));
  const color = avg >= 70 ? '#22c55e' : avg >= 40 ? '#eab308' : '#ef4444';
  return `<div class="flex items-center gap-2">
    <div class="flex-1 h-1.5 rounded-full" style="background:rgba(255,255,255,0.08);">
      <div class="h-full rounded-full transition-all" style="width:${pct}%;background:${color};"></div>
    </div>
    <span class="text-[11px] font-bold font-label" style="color:${color};">${avg.toFixed(0)}</span>
    <span class="text-[10px] text-on-surface-variant/50">(${rep.count}건)</span>
  </div>`;
}

function agentCard(agent) {
  const trust = TRUST_STYLE[agent.trustLevel] ?? TRUST_STYLE.unverified;
  const caps  = (agent.capabilities || []).slice(0, 6);
  const more  = (agent.capabilities || []).length - 6;
  const tokenIdShort = agent.tokenId ? `#${agent.tokenId}` : '미등록';
  const agentIdShort = agent.agentId
    ? agent.agentId.replace('oc_ext_', '') : agent.agentId;

  return `<div class="rounded-xl p-5 flex flex-col gap-4 transition-all hover:scale-[1.01]"
    style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);">

    <!-- Header -->
    <div class="flex items-start justify-between">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="material-symbols-outlined text-base" style="color:${trust.color};font-variation-settings:'FILL' 1;">${trust.icon}</span>
          <span class="text-[10px] font-bold font-label uppercase tracking-wider px-2 py-0.5 rounded"
            style="background:${trust.bg};color:${trust.color};">${trust.label}</span>
        </div>
        <p class="font-mono text-xs text-on-surface-variant mt-1 tracking-tight">oc_ext_<span class="text-on-surface font-bold">${agentIdShort}</span></p>
      </div>
      <div class="text-right">
        <span class="text-[10px] font-label text-on-surface-variant/50 block">Token ID</span>
        <span class="font-headline font-bold text-primary text-sm">${tokenIdShort}</span>
      </div>
    </div>

    <!-- Capabilities -->
    <div>
      <p class="text-[9px] font-label text-on-surface-variant/50 uppercase tracking-widest mb-2">Capabilities</p>
      <div class="flex flex-wrap gap-1.5">
        ${caps.map((c, i) => domainTag(c, i)).join('')}
        ${more > 0 ? `<span class="px-2 py-0.5 rounded text-[10px] font-label text-on-surface-variant" style="background:rgba(255,255,255,0.05);">+${more}</span>` : ''}
      </div>
    </div>

    <!-- Reputation -->
    <div>
      <p class="text-[9px] font-label text-on-surface-variant/50 uppercase tracking-widest mb-2">On-chain 평판</p>
      ${reputationBar(agent.reputation)}
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-between pt-2 border-t" style="border-color:rgba(255,255,255,0.05);">
      <span class="text-[10px] font-label text-on-surface-variant/50 flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-primary inline-block animate-pulse"></span>
        ${agent.connectedAgo ?? '연결됨'}
      </span>
      <span class="text-[10px] font-label text-on-surface-variant/40">v${agent.version ?? '?'}</span>
    </div>
  </div>`;
}

async function loadAgentRegistry() {
  const listEl  = document.getElementById('agent-registry-list');
  const statsEl = document.getElementById('agent-registry-stats');
  const dotEl   = document.getElementById('chain-dot');
  const textEl  = document.getElementById('chain-status-text');

  if (listEl) listEl.innerHTML = '<div class="skeleton-block h-40"></div><div class="skeleton-block h-40"></div>';

  // 체인 상태
  try {
    const chain = await fetch('/api/chain').then(r => r.json()).catch(() => null);
    if (chain?.ok) {
      dotEl.className = 'w-1.5 h-1.5 rounded-full bg-primary animate-pulse';
      textEl.textContent = `HPP Sepolia · chainId ${chain.chain?.chainId} · Block #${chain.chain?.blockNumber?.toLocaleString()}`;
      textEl.style.color = '#00daf3';
    } else {
      dotEl.className = 'w-1.5 h-1.5 rounded-full bg-error';
      textEl.textContent = 'On-chain 연결 실패';
      textEl.style.color = '#ffb4ab';
    }
  } catch { /* ignore */ }

  try {
    const data = await fetch('/api/dashboard/agents').then(r => r.json());

    if (!data.ok || !data.agents) throw new Error(data.error ?? '데이터 없음');

    const agents = data.agents;
    const verified = agents.filter(a => a.trustLevel === 'platform_verified').length;
    const totalCaps = [...new Set(agents.flatMap(a => a.capabilities || []))].length;

    if (statsEl) {
      statsEl.innerHTML = `
        <span class="flex items-center gap-1">
          <span class="material-symbols-outlined text-xs text-primary">group</span>
          <strong class="text-on-surface">${agents.length}</strong> 에이전트
        </span>
        <span class="flex items-center gap-1">
          <span class="material-symbols-outlined text-xs" style="color:#22c55e;">verified</span>
          <strong class="text-on-surface">${verified}</strong> 검증됨
        </span>
        <span class="flex items-center gap-1">
          <span class="material-symbols-outlined text-xs text-secondary">extension</span>
          <strong class="text-on-surface">${totalCaps}</strong> 기술 도메인
        </span>`;
    }

    if (!listEl) return;

    if (agents.length === 0) {
      listEl.innerHTML = `<div class="md:col-span-3 flex flex-col items-center justify-center py-12 gap-3 text-on-surface-variant/40">
        <span class="material-symbols-outlined text-5xl">cloud_off</span>
        <p class="text-sm font-label">현재 연결된 에이전트가 없습니다</p>
      </div>`;
      return;
    }

    listEl.innerHTML = agents.map(agentCard).join('');

  } catch (err) {
    if (listEl) listEl.innerHTML = `<div class="md:col-span-3 flex items-center gap-3 py-8 px-4 rounded-lg text-sm font-label" style="background:rgba(255,180,171,0.05);border:1px solid rgba(255,180,171,0.15);color:#ffb4ab;">
      <span class="material-symbols-outlined">error</span>
      ${err.message}
    </div>`;
  }
}
</script>
</body></html>
