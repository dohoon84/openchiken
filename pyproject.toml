[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openchiken"
version = "0.1.0"
description = "로컬 AI 비서 에이전트 – Telegram + Gmail + Google Calendar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "langchain-google-community[gmail]>=2.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "duckduckgo-search>=6.0.0",
    "apscheduler>=3.10.0",
    "ddgs>=9.11.4",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "slack-bolt>=1.18.0",
    "discord-py>=2.4.0",
    "yfinance>=0.2.0",
    "numpy>=1.26.0",
]

[tool.setuptools]
py-modules = ["main", "server", "setup_wizard"]

[tool.setuptools.packages.find]
include = ["core*", "config*", "skills*", "channels*", "scheduler*", "static*", "local_ui*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.md", "*.json", "*.png", "*.ico", "*.svg"]

[project.scripts]
openchiken = "main:main"
openchiken-setup = "setup_wizard:main"
openchiken-web = "server:run_server"
