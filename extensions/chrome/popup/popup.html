<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>OpenChiken</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">

    <!-- ── Header ── -->
    <header class="header">
      <div class="logo">
        <div class="logo-mark">OC</div>
        <span class="logo-text">OpenChiken</span>
      </div>
      <div class="header-right">
        <div class="relay-badge" id="relayBadge">
          <span class="relay-dot" id="relayDot"></span>
          <span class="relay-label" id="relayLabel">연결 중...</span>
        </div>
        <button class="icon-btn" id="btnSettings" title="설정">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── Agent ID bar ── -->
    <div class="id-bar">
      <span class="id-label">Agent ID</span>
      <code class="id-value" id="agentIdVal">—</code>
    </div>

    <!-- ── 승인 요청 패널 (기본 숨김) ── -->
    <section class="approval-panel hidden" id="approvalPanel">
      <div class="approval-header">
        <div class="approval-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#F97316">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13" stroke="#fff" stroke-width="2"/>
            <line x1="12" y1="17" x2="12.01" y2="17" stroke="#fff" stroke-width="2"/>
          </svg>
        </div>
        <span class="approval-title">외부 에이전트 접근 요청</span>
      </div>

      <div class="approval-body">
        <div class="approval-row">
          <span class="ak">호출 에이전트</span>
          <span class="av" id="apCaller">—</span>
        </div>
        <div class="approval-row">
          <span class="ak">신뢰 등급</span>
          <span class="av trust-badge" id="apTrust">—</span>
        </div>
        <div class="approval-row">
          <span class="ak">요청 스킬</span>
          <span class="av" id="apSkill">—</span>
        </div>
        <div class="approval-row">
          <span class="ak">파라미터</span>
          <code class="av ap-params" id="apParams">—</code>
        </div>
      </div>

      <div class="approval-actions">
        <button class="btn btn-reject" id="btnReject">거절</button>
        <button class="btn btn-approve" id="btnApprove">승인</button>
      </div>
    </section>

    <!-- ── 대기 상태 (승인 없을 때) ── -->
    <section class="idle-panel" id="idlePanel">
      <div class="idle-icon">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="16" stroke="#2D2D2D" stroke-width="1.5"/>
          <circle cx="18" cy="18" r="5" fill="#2D2D2D"/>
          <line x1="18" y1="4" x2="18" y2="9"  stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="18" y1="27" x2="18" y2="32" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="4"  y1="18" x2="9"  y2="18" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="27" y1="18" x2="32" y2="18" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="idle-title">에이전트 대기 중</div>
      <div class="idle-sub">외부 에이전트 요청을 수신하면<br/>정책 엔진이 자동으로 처리합니다</div>
    </section>

    <!-- ── 활동 로그 ── -->
    <section class="log-section">
      <div class="log-header">
        <span class="log-title">최근 활동</span>
        <button class="log-clear" id="btnClearLog">지우기</button>
      </div>
      <ul class="log-list" id="logList">
        <li class="log-empty">아직 활동 없음</li>
      </ul>
    </section>

  </div>
  <script src="popup.js"></script>
</body>
</html>
